org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# ---------------------------------------------------------------------------
# Single source of truth for the whole project.
# Read by settings.gradle.kts, build.gradle.kts, the generated BuildConfig and
# (through processResources) by fabric.mod.json. Nothing below is duplicated.
# ---------------------------------------------------------------------------

# Mod
mod_id=trade-aura
mod_name=TradeAura
mod_version=1.21.4-2.1.0
mod_description=Meteor addon for fully automated villager trading
mod_author=fapotaa
mod_color=225,25,25
maven_group=com.TradeAura
mod_package=com.TradeAura.addon

# Shown as the module category inside Meteor
category_name=TradeAura

# Used for the repo link in fabric.mod.json and for MeteorAddon#getRepo()
github_owner=fapotaa
github_repo=TradeAura

# Minecraft / Fabric (https://fabricmc.net/develop/)
# 1.21.4 is still an obfuscated release, so yarn mappings and loom remapping are required.
jdk_version=21
minecraft_version=1.21.4
yarn_mappings=1.21.4+build.8
loader_version=0.16.9
loom_version=1.9-SNAPSHOT

# Meteor (https://github.com/MeteorDevelopment/meteor-client)
# Matches meteor-client-1.21.4-18.jar and newer 1.21.4 builds.
meteor_version=1.21.4-SNAPSHOT
